[project]
name = "lecture-3-playwright"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.1.1",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.10.0",
]

# this for configuration pytest
[tool.pytest.ini_options]
testpaths = ["tests"]

# --headed: always open a visible browser window (no headless mode).
addopts = '--headed'
